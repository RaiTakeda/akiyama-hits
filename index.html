<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="秋山翔吾選手の日米通算安打数を表示する非公式ページ">
  <title>秋山翔吾 日米通算安打</title>

  <style>
    :root {
      --background-red: #f5140f;
      --white: #ffffff;
      --soft-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      color: var(--white);
      background: var(--background-red);
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "MS PMincho",
        "Times New Roman",
        serif;
    }

    .page {
      display: flex;
      width: 100%;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      background: var(--background-red);
    }

    .wrap {
      display: flex;
      width: min(540px, 100%);
      height: min(940px, calc(100dvh - 40px));
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .top {
      width: 100%;
      padding-top: 10px;
    }

    .name {
      color: var(--white);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.02em;
    }

    .divider {
      width: 100%;
      height: 4px;
      margin-top: 28px;
      background: var(--white);
    }

    .center {
      display: flex;
      width: 100%;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .subtitle {
      margin-bottom: 14px;
      color: var(--white);
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .hits-number {
      color: var(--white);
      font-family:
        Impact,
        "Arial Narrow",
        sans-serif;
      font-size: clamp(7rem, 30vw, 12rem);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
      letter-spacing: -0.04em;
    }

    .hits-label {
      margin-top: 8px;
      color: var(--white);
      font-size: clamp(3.8rem, 14vw, 6rem);
      font-weight: 700;
      line-height: 1;
    }

    .date {
      margin-top: 20px;
      color: var(--white);
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
    }

    .bottom {
      display: flex;
      width: 100%;
      padding-bottom: 8px;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .formula {
      color: var(--white);
      font-size: clamp(1.9rem, 6vw, 3.1rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .source-link {
      display: inline-flex;
      min-width: 220px;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 2px solid var(--white);
      color: var(--white);
      background: transparent;
      font-family:
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      font-size: clamp(1rem, 3.4vw, 1.2rem);
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      transition:
        color 0.15s ease,
        background-color 0.15s ease;
    }

    .source-link:hover,
    .source-link:focus-visible {
      color: var(--background-red);
      background: var(--white);
      outline: none;
    }

    @media (max-height: 760px) {
      .divider {
        margin-top: 20px;
      }

      .subtitle {
        margin-bottom: 10px;
      }

      .hits-label {
        margin-top: 4px;
      }

      .date {
        margin-top: 12px;
      }

      .bottom {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="wrap">
      <header class="top">
        <h1 class="name">秋山翔吾</h1>
        <div class="divider" aria-hidden="true"></div>
      </header>

      <main class="center">
        <div class="subtitle">日米通算</div>
        <div id="totalHits" class="hits-number">1854</div>
        <div class="hits-label">HITS</div>
        <time id="snapshotDate" class="date" datetime="2026-07-21">
          2026.7.21
        </time>
      </main>

      <footer class="bottom">
        <div id="formulaText" class="formula">1832+22</div>

        <a
          class="source-link"
          href="https://npb.jp/bis/players/31135133.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          NPB公式サイト ↗
        </a>
      </footer>
    </div>
  </div>

  <!-- GitHub Actionsが生成・更新するデータ -->
  <script src="data.js"></script>

  <script>
    const FALLBACK_STATS = {
      previousHits: 1832,
      currentHits: 22,
      totalHits: 1854,
      asOfDate: "2026.7.21",
      asOfDateIso: "2026-07-21"
    };

    const stats = window.AKIYAMA_STATS ?? FALLBACK_STATS;

    const totalHitsElement = document.getElementById("totalHits");
    const dateElement = document.getElementById("snapshotDate");
    const formulaElement = document.getElementById("formulaText");

    // 桁区切りカンマを入れずに表示
    totalHitsElement.textContent = String(stats.totalHits);
    dateElement.textContent = stats.asOfDate;
    dateElement.dateTime = stats.asOfDateIso;
    formulaElement.textContent =
      `${stats.previousHits}+${stats.currentHits}`;
  </script>
</body>
</html>
