name: Update and deploy Akiyama hit count

on:
  workflow_dispatch:

  schedule:
    # 毎日21:15（日本時間）に実行
    - cron: "15 12 * * *"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch NPB stats
        run: python update_stats.py

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data.js; then
            echo "data.js has no changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add data.js
            git commit -m "Update Akiyama hit count"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html data.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
